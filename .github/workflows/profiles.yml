# The agents and apps profiles come from nixpkgs-unstable and are installed
# outside the system closure. The weekly run builds both so a broken package
# shows up before the next `nix profile upgrade`. The closures are about 2 GiB
# (agents) and 4 GiB (apps) unpacked. Chrome and Edge are unfree, so they are
# fetched from the vendors instead of the public cache.
name: Profiles

on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [agents, apps]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build the ${{ matrix.profile }} profile
        run: nix build --no-link .#packages.x86_64-linux.${{ matrix.profile }}
