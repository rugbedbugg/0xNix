# The agents and apps profiles come from nixpkgs-unstable and are installed
# outside the system closure. The weekly run updates that input first, as the
# upgrade steps in flake.nix do, then builds both profiles. A broken package
# shows up before the next `nix profile upgrade`. The updated lock stays in
# the job. The closures are about 2 GiB (agents) and 4 GiB (apps) unpacked.
# Unfree packages are not in the public cache, so the job fetches or builds
# them.
name: Profiles

on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [agents, apps]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Follow the latest nixpkgs-unstable
        run: nix flake update nixpkgs-unstable
      - name: Build the ${{ matrix.profile }} profile
        run: nix build --no-link .#packages.x86_64-linux.${{ matrix.profile }}
