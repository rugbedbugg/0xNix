# Evaluate the rice fixtures and check formatting. Compile and lint the
# Python desktop scripts.
#
# The desktop-config job builds the one check that runs the desktop tools:
# the Lua parse, the Waybar JSON and Hyprland's own config verification. Its
# inputs come from the public cache. Build the full theme fixtures locally.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: nix fmt -- --check $(git ls-files '*.nix')
      - name: Evaluate the flake
        run: nix flake check --no-build
      - name: Check the Python scripts
        run: nix build --no-link .#checks.x86_64-linux.python-scripts

  desktop-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build the desktop config check
        run: nix build --no-link .#checks.x86_64-linux.desktop-config
